    <rect x="200" y="185" width="7" height="22" rx="3.5"/>
    <rect x="219" y="176" width="7" height="40" rx="3.5"/>
    <rect x="238" y="168" width="7" height="56" rx="3.5"/>
    <rect x="257" y="179" width="7" height="34" rx="3.5"/>
    <rect x="276" y="188" width="7" height="16" rx="3.5"/>
  </g>

  <!-- F monogram -->
  <text x="256" y="416" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif" font-size="168" font-weight="600" letter-spacing="-6" fill="#F4F3EF">F</text>
</svg>
