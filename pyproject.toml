[project]
name = "friday-local"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["laya-mlx==0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: requires the real laya checkpoint (deselected by default)"]
